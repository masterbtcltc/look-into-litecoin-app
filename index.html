<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>LTC • Digital Silver Supremacy</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Look Into Litecoin">
  <link rel="apple-touch-icon" href="favicon.png">
 
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800;900&display=swap');
   
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
   
    :root {
      --navy: #0B2C5A;
      --navy-dark: #071E3D;
      --ltc-blue: #2E6B9E;
      --ltc-blue-bright: #3B82C4;
      --accent: #4A9BE0;
      --white: #ffffff;
      --text-muted: #94a3b8;
    }
    html, body {
      height: 100%;
      background: #000;
      font-family: 'Exo 2', sans-serif;
      color: white;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-y;
    }
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: var(--white);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.35);
    }
    .header img { height: 42px; width: auto; }
    .header-nav {
      display: flex;
      align-items: center;
      gap: 22px;
    }
    .header-nav a {
      color: var(--navy);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }
    .header-nav a:hover {
      color: var(--ltc-blue-bright);
    }
    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      background: rgba(46, 107, 158, 0.18);
      border: 2px solid var(--ltc-blue);
      border-radius: 50%;
      color: var(--accent);
      font-size: 1.6rem;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 900;
      transition: all 0.2s ease;
      user-select: none;
    }
    .nav-arrow:hover { background: var(--ltc-blue); color: white; }
    .nav-arrow.left { left: 18px; }
    .nav-arrow.right { right: 18px; }
    @media (min-width: 768px) { .nav-arrow { display: flex; } }
    #slider {
      position: absolute;
      top: 64px;
      left: 0;
      width: 200%;
      height: calc(100% - 64px);
      display: flex;
      transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
      will-change: transform;
    }
    #slider.page-1 { transform: translateX(0); }
    #slider.page-2 { transform: translateX(-50%); }
    .page {
      width: 50%;
      height: 100%;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    /* PAGE 1 */
    #page-clock {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px 12px;
      text-align: center;
      background: #000;
    }
    #price-container {
      width: 94vw;
      max-width: 820px;
      z-index: 2;
      position: relative;
    }
    .price-line {
      font-size: clamp(17px, 3.2vw, 36px);
      font-weight: 800;
      letter-spacing: 1px;
      margin: 2px 0;
      color: var(--accent);
      text-transform: uppercase;
      line-height: 1.15;
      white-space: nowrap;
    }
    @media (min-width: 1000px) {
      .price-line { font-size: 32px; margin: 3px 0; }
    }
    @media (min-width: 1400px) {
      .price-line { font-size: 34px; }
    }
    @media (hover: hover) and (pointer: fine) {
      .price-line:hover { color: #6bb3f0; }
    }
    .ltc-phrase {
      position: absolute;
      max-width: 85vw;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 1.2px;
      text-shadow: 0 0 12px rgba(74, 155, 224, 0.7);
      opacity: 0;
      z-index: 3;
      pointer-events: none;
      line-height: 1.3;
    }
    .ltc-logo { position: absolute; opacity: 0.04; z-index: 1; pointer-events: none; }
    /* PAGE 2 */
    #page-portfolio {
      background: #05080f;
      padding: 20px 16px 60px;
      color: white;
    }
    .portfolio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .portfolio-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      margin: 0;
    }
    .header-buttons { display: flex; gap: 10px; }
    .btn {
      background: var(--ltc-blue);
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--ltc-blue-bright); }
    .btn-secondary {
      background: transparent;
      border: 2px solid var(--ltc-blue);
      color: var(--accent);
    }
    .btn-secondary:hover { background: rgba(46, 107, 158, 0.25); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .total-balance {
      background: linear-gradient(145deg, var(--navy-dark), var(--navy));
      border: 1px solid rgba(74, 155, 224, 0.35);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .total-balance .label {
      font-size: 0.9rem;
      opacity: 0.75;
      margin-bottom: 6px;
      color: #c5d4e8;
    }
    .total-balance .amount {
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--accent);
    }
    .total-balance .usd {
      font-size: 1.05rem;
      opacity: 0.85;
      margin-top: 4px;
      color: #b8cce0;
    }
    /* Chart */
    .chart-container {
      background: #0c1220;
      border: 1px solid #1a2740;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .chart-header h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      margin: 0;
    }
    .chart-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .toggle-group {
      display: flex;
      background: #111827;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #1e3a5f;
    }
    .toggle-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: var(--ltc-blue);
      color: white;
    }
    .chart-actions button {
      background: none;
      border: 1px solid #2a3f5f;
      color: #94a3b8;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .chart-actions button:hover {
      border-color: var(--ltc-blue);
      color: var(--accent);
    }
    #balanceChart {
      width: 100% !important;
      max-height: 220px;
    }
    .address-list { display: flex; flex-direction: column; gap: 12px; }
    .address-card {
      background: #0c1220;
      border: 1px solid #1a2740;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .address-info { flex: 1; min-width: 0; }
    .address-label {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e2eaf5;
    }
    .address-text {
      font-size: 0.78rem;
      opacity: 0.55;
      font-family: monospace;
      word-break: break-all;
      color: #94a3b8;
    }
    .address-balance {
      text-align: right;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      opacity: 0.65;
      color: #94a3b8;
    }
    .empty-state p { margin-bottom: 20px; }
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 2000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #0c1220;
      width: 100%;
      max-width: 480px;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 40px;
      max-height: 88vh;
      overflow-y: auto;
      border-top: 1px solid #1e3a5f;
    }
    .modal h2 {
      font-size: 1.35rem;
      margin-bottom: 18px;
      color: var(--accent);
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #94a3b8;
    }
    .form-group input {
      width: 100%;
      background: #111827;
      border: 1px solid #1e3a5f;
      color: white;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--ltc-blue);
    }
    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .modal-actions .btn { flex: 1; }
    .saved-list { margin-top: 28px; }
    .saved-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #1a2740;
    }
    .saved-item .info { flex: 1; min-width: 0; }
    .saved-item .label { font-weight: 600; color: #e2eaf5; }
    .saved-item .addr {
      font-size: 0.75rem;
      opacity: 0.55;
      font-family: monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #94a3b8;
    }
    .delete-btn {
      background: none;
      border: none;
      color: #f87171;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px 8px;
    }
    .swipe-hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      opacity: 0.4;
      z-index: 50;
      pointer-events: none;
      color: #94a3b8;
    }
    @media (max-width: 600px) {
      .header img { height: 36px; }
      .header-nav { gap: 14px; }
      .header-nav a { font-size: 0.82rem; }
      .price-line {
        font-size: clamp(15px, 5.2vw, 26px);
        margin: 2px 0;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <img src="lilbanner.png" alt="Look Into Litecoin" />
    <nav class="header-nav">
      <a href="https://shop.lookintolitecoin.com/collections/signed-book">Books</a>
      <a href="https://shop.lookintolitecoin.com/">Shop</a>
      <a href="https://www.lookintolitecoin.com/lookintolitecoin">Articles</a>
    </nav>
  </header>
  <div class="nav-arrow left" id="arrow-left">‹</div>
  <div class="nav-arrow right" id="arrow-right">›</div>
  <div id="slider" class="page-1">
   
    <!-- PAGE 1 -->
    <div class="page" id="page-clock">
      <div id="price-container">
        <div id="btc-price" class="price-line">BTC</div>
        <div id="ltc-price" class="price-line">LTC</div>
        <div id="eth-price" class="price-line">ETH</div>
        <div id="doge-price" class="price-line">DOGE</div>
        <div id="btc-ltc-ratio" class="price-line">BTCLTC</div>
        <div id="eth-ltc-ratio" class="price-line">ETHLTC</div>
        <div id="doge-ltc-ratio" class="price-line">DOGELTC</div>
        <div id="ltc-btc-ratio" class="price-line">LTCBTC</div>
        <div id="ltc-eth-ratio" class="price-line">LTCETH</div>
        <div id="ltc-doge-ratio" class="price-line">LTCDOGE</div>
      </div>
    </div>
    <!-- PAGE 2 -->
    <div class="page" id="page-portfolio">
      <div class="portfolio-header">
        <h1 id="portfolio-title">My Litecoin</h1>
        <div class="header-buttons">
          <button class="btn btn-secondary" id="refresh-btn">↻</button>
          <button class="btn" id="open-settings">+ Addresses</button>
        </div>
      </div>
      <div class="total-balance">
        <div class="label">Total Balance</div>
        <div class="amount" id="total-ltc">—</div>
        <div class="usd" id="total-usd">≈ $—</div>
      </div>
      <!-- CHART -->
      <div class="chart-container">
        <div class="chart-header">
          <h3>Balance Over Time</h3>
          <div class="chart-controls">
            <div class="toggle-group">
              <button class="toggle-btn active" id="toggle-ltc">LTC</button>
              <button class="toggle-btn" id="toggle-usd">USD</button>
            </div>
            <div class="chart-actions">
              <button id="clear-history">Clear</button>
            </div>
          </div>
        </div>
        <canvas id="balanceChart" height="180"></canvas>
      </div>
      <div class="address-list" id="address-list"></div>
    </div>
  </div>
  <div class="swipe-hint" id="swipe-hint">← Swipe for Portfolio</div>
  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <h2>Portfolio Settings</h2>
     
      <div class="form-group">
        <label>Portfolio Name</label>
        <input type="text" id="portfolio-name-input" placeholder="e.g. Cold Storage, Family Stack">
      </div>
      <hr style="border: none; border-top: 1px solid #1e3a5f; margin: 24px 0;">
      <h3 style="font-size: 1.1rem; margin-bottom: 14px; color: var(--accent);">Add Address</h3>
     
      <div class="form-group">
        <label>Label (optional)</label>
        <input type="text" id="addr-label" placeholder="e.g. Cold Storage, Exchange">
      </div>
      <div class="form-group">
        <label>Litecoin Address</label>
        <input type="text" id="addr-input" placeholder="L... or M... or ltc1...">
      </div>
     
      <div class="modal-actions">
        <button class="btn btn-secondary" id="close-settings">Close</button>
        <button class="btn" id="save-address">Save Address</button>
      </div>
      <div class="saved-list" id="saved-list"></div>
    </div>
  </div>
  <script src="renderer.js"></script>
  <script>
    const STORAGE_KEY = 'ltc_watch_addresses';
    const NAME_KEY = 'ltc_portfolio_name';
    const HISTORY_KEY = 'ltc_balance_history';
   
    let addresses = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let portfolioName = localStorage.getItem(NAME_KEY) || 'My Litecoin';
    let balanceHistory = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    let currentPage = 1;
    let ltcPriceUsd = 0;
    let isRefreshing = false;
    let balanceChart = null;
    let chartMode = 'ltc'; // 'ltc' or 'usd'
    document.getElementById('portfolio-title').textContent = portfolioName;
    // ========== CHART ==========
    function initChart() {
      const ctx = document.getElementById('balanceChart').getContext('2d');
     
      balanceChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: 'Balance',
            data: [],
            borderColor: '#4A9BE0',
            backgroundColor: 'rgba(74, 155, 224, 0.12)',
            borderWidth: 2.5,
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: '#4A9BE0',
            pointHoverRadius: 5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#0c1220',
              titleColor: '#94a3b8',
              bodyColor: '#e2eaf5',
              borderColor: '#1e3a5f',
              borderWidth: 1,
              callbacks: {
                label: function(context) {
                  if (chartMode === 'ltc') {
                    return context.parsed.y.toFixed(4) + ' LTC';
                  } else {
                    return '$' + context.parsed.y.toLocaleString(undefined, {maximumFractionDigits: 2});
                  }
                }
              }
            }
          },
          scales: {
            x: {
              ticks: { color: '#64748b', maxTicksLimit: 6, font: { size: 11 } },
              grid: { color: 'rgba(30, 58, 95, 0.4)' }
            },
            y: {
              ticks: {
                color: '#64748b',
                font: { size: 11 },
                callback: function(value) {
                  if (chartMode === 'ltc') {
                    return value.toFixed(2);
                  } else {
                    return '$' + value.toLocaleString(undefined, {maximumFractionDigits: 0});
                  }
                }
              },
              grid: { color: 'rgba(30, 58, 95, 0.4)' }
            }
          }
        }
      });
      updateChart();
    }
    function updateChart() {
      if (!balanceChart) return;
      const labels = balanceHistory.map(p => {
        const d = new Date(p.t);
        return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
               ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      });
      const data = balanceHistory.map(p => {
        return chartMode === 'ltc' ? p.balance : (p.usd || 0);
      });
      balanceChart.data.labels = labels;
      balanceChart.data.datasets[0].data = data;
      balanceChart.data.datasets[0].label = chartMode === 'ltc' ? 'LTC Balance' : 'USD Value';
      balanceChart.update();
    }
    function addHistoryPoint(balanceLtc, usdValue) {
      const now = Date.now();
      // Avoid adding too frequently (min 2 minutes apart)
      if (balanceHistory.length > 0) {
        const last = balanceHistory[balanceHistory.length - 1];
        if (now - last.t < 2 * 60 * 1000) return;
      }
      balanceHistory.push({
        t: now,
        balance: balanceLtc,
        usd: usdValue || 0
      });
      // Keep only last 40 points
      if (balanceHistory.length > 40) {
        balanceHistory = balanceHistory.slice(-40);
      }
      localStorage.setItem(HISTORY_KEY, JSON.stringify(balanceHistory));
      updateChart();
    }
    // Toggle buttons
    document.getElementById('toggle-ltc').onclick = () => {
      chartMode = 'ltc';
      document.getElementById('toggle-ltc').classList.add('active');
      document.getElementById('toggle-usd').classList.remove('active');
      updateChart();
    };
    document.getElementById('toggle-usd').onclick = () => {
      chartMode = 'usd';
      document.getElementById('toggle-usd').classList.add('active');
      document.getElementById('toggle-ltc').classList.remove('active');
      updateChart();
    };
    document.getElementById('clear-history').onclick = () => {
      if (confirm('Clear all balance history?')) {
        balanceHistory = [];
        localStorage.setItem(HISTORY_KEY, JSON.stringify([]));
        updateChart();
      }
    };
    // ========== NAVIGATION ==========
    const slider = document.getElementById('slider');
    const hint = document.getElementById('swipe-hint');
    let startX = 0, startY = 0, isDragging = false;
    document.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      isDragging = true;
    }, { passive: true });
    document.addEventListener('touchmove', e => {
      if (!isDragging) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) e.preventDefault();
    }, { passive: false });
    document.addEventListener('touchend', e => {
      if (!isDragging) return;
      isDragging = false;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
      if (dx < 0 && currentPage === 1) goToPage(2);
      else if (dx > 0 && currentPage === 2) goToPage(1);
    });
    document.getElementById('arrow-left').onclick = () => {
      if (currentPage === 2) goToPage(1);
    };
    document.getElementById('arrow-right').onclick = () => {
      if (currentPage === 1) goToPage(2);
    };
    function goToPage(page) {
      currentPage = page;
      slider.className = page === 1 ? 'page-1' : 'page-2';
      hint.textContent = page === 1 ? '← Swipe for Portfolio' : 'Swipe for Clock →';
     
      document.getElementById('arrow-left').style.opacity = page === 1 ? '0.3' : '1';
      document.getElementById('arrow-right').style.opacity = page === 2 ? '0.3' : '1';
      if (page === 2) {
        refreshBalances();
        if (!balanceChart) initChart();
        else updateChart();
      }
    }
    // ========== SETTINGS ==========
    const modal = document.getElementById('settings-modal');
   
    document.getElementById('open-settings').onclick = () => {
      document.getElementById('portfolio-name-input').value = portfolioName;
      renderSavedList();
      modal.classList.add('open');
    };
   
    document.getElementById('close-settings').onclick = () => {
      const newName = document.getElementById('portfolio-name-input').value.trim() || 'My Litecoin';
      portfolioName = newName;
      localStorage.setItem(NAME_KEY, newName);
      document.getElementById('portfolio-title').textContent = newName;
      modal.classList.remove('open');
    };
    document.getElementById('save-address').onclick = () => {
      const label = document.getElementById('addr-label').value.trim() || 'Address';
      const addr = document.getElementById('addr-input').value.trim();
      if (!addr) return alert('Please enter an address');
      if (!isValidLtcAddress(addr)) return alert('That does not look like a valid Litecoin address');
      if (addresses.some(a => a.address.toLowerCase() === addr.toLowerCase())) {
        return alert('This address is already saved');
      }
      addresses.push({ label, address: addr });
      saveAddresses();
      document.getElementById('addr-label').value = '';
      document.getElementById('addr-input').value = '';
      renderSavedList();
      refreshBalances();
    };
    function isValidLtcAddress(addr) {
      return /^(L|M)[a-km-zA-HJ-NP-Z1-9]{26,33}$/.test(addr) ||
             /^ltc1[a-z0-9]{39,59}$/i.test(addr);
    }
    function saveAddresses() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(addresses));
    }
    function renderSavedList() {
      const container = document.getElementById('saved-list');
      if (addresses.length === 0) {
        container.innerHTML = '<p style="opacity:0.5;margin-top:20px;color:#94a3b8;">No addresses saved yet</p>';
        return;
      }
      container.innerHTML = addresses.map((a, i) => `
        <div class="saved-item">
          <div class="info">
            <div class="label">${escapeHtml(a.label)}</div>
            <div class="addr">${a.address}</div>
          </div>
          <button class="delete-btn" data-index="${i}">×</button>
        </div>
      `).join('');
      container.querySelectorAll('.delete-btn').forEach(btn => {
        btn.onclick = () => {
          addresses.splice(+btn.dataset.index, 1);
          saveAddresses();
          renderSavedList();
          refreshBalances();
        };
      });
    }
    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    // ========== REFRESH ==========
    document.getElementById('refresh-btn').onclick = () => {
      if (!isRefreshing) refreshBalances(true);
    };
    async function refreshBalances(manual = false) {
      if (isRefreshing) return;
      isRefreshing = true;
      const refreshBtn = document.getElementById('refresh-btn');
      refreshBtn.disabled = true;
      refreshBtn.textContent = '…';
      const list = document.getElementById('address-list');
     
      if (addresses.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <p>No addresses added yet</p>
            <button class="btn" onclick="document.getElementById('open-settings').click()">
              Add your first address
            </button>
          </div>`;
        document.getElementById('total-ltc').textContent = '0.00 LTC';
        document.getElementById('total-usd').textContent = '≈ $0.00';
        finishRefresh();
        return;
      }
      if (manual) {
        list.innerHTML = '<div style="text-align:center;padding:40px;opacity:0.6;color:#94a3b8">Refreshing…</div>';
      }
      let totalSats = 0;
      const results = [];
      for (const item of addresses) {
        try {
          const res = await fetch(`https://api.blockcypher.com/v1/ltc/main/addrs/${item.address}/balance`);
          if (!res.ok) throw new Error('API error');
          const data = await res.json();
          const balance = data.balance || 0;
          results.push({ ...item, balance });
          totalSats += balance;
        } catch (err) {
          results.push({ ...item, balance: null, error: true });
        }
      }
      // Get LTC price
      const ltcEl = document.getElementById('ltc-price');
      if (ltcEl && ltcEl.textContent.includes('$')) {
        const match = ltcEl.textContent.match(/[\d,.]+/);
        if (match) ltcPriceUsd = parseFloat(match[0].replace(/,/g, ''));
      }
      if (!ltcPriceUsd) {
        try {
          const p = await fetch('https://api.coinbase.com/v2/prices/LTC-USD/spot');
          const j = await p.json();
          ltcPriceUsd = parseFloat(j.data.amount);
        } catch(e) {}
      }
      const totalLtc = totalSats / 1e8;
      const totalUsd = totalLtc * (ltcPriceUsd || 0);
      document.getElementById('total-ltc').textContent = totalLtc.toLocaleString(undefined, {maximumFractionDigits: 8}) + ' LTC';
      document.getElementById('total-usd').textContent = ltcPriceUsd
        ? `≈ $${totalUsd.toLocaleString(undefined, {maximumFractionDigits: 2})}`
        : '≈ $—';
      // Record history point (both LTC and USD)
      addHistoryPoint(totalLtc, totalUsd);
      list.innerHTML = results.map(r => {
        const bal = r.balance === null ? 'Error' : (r.balance / 1e8).toLocaleString(undefined, {maximumFractionDigits: 8});
        return `
          <div class="address-card">
            <div class="address-info">
              <div class="address-label">${escapeHtml(r.label)}</div>
              <div class="address-text">${r.address}</div>
            </div>
            <div class="address-balance">${bal} LTC</div>
          </div>`;
      }).join('');
      finishRefresh();
    }
    function finishRefresh() {
      isRefreshing = false;
      const refreshBtn = document.getElementById('refresh-btn');
      refreshBtn.disabled = false;
      refreshBtn.textContent = '↻';
    }
    // ========== FLOATING LOGOS ==========
    const NUM_LOGOS = 7;
    const LOGO_SRC = 'https://cryptologos.cc/logos/litecoin-ltc-logo.svg?v=030';
    const logos = [];
    const phrases = [
      "Litecoin is the best for payments — lowest fees with the most upside.",
      "Are we all underestimating how big Litecoin is going to be?",
      "If it’s good money, just use it.",
      "Not owning Litecoin is a bet against Elon.",
      "Everyone should diversify at least 1% into Litecoin — it’s 100x undervalued.",
      "The scam is keeping people away from Litecoin.",
      "Litecoin is a better Bitcoin.",
      "Litecoin to $13K then $31K.",
      "You can’t spell inevitable without Lee.",
      "Litecoin heading to #2 market cap, then #1.",
      "LTC is so cheap here.",
      "Bitcoin dominance will fall below 30% — watch.",
      "Litecoin is the best money we have on earth.",
      "Accumulate Litecoin — it can do 100x at the drop of a hat.",
      "Everyone’s ultra bearish on Litecoin when you should be ultra bullish.",
      "Litecoin is digital silver — fast, private, and massively undervalued.",
      "Wen digital silver’s turn?",
      "Something new is cooking for Litecoin…",
      "Litecoin offers auditable supply with optional privacy via MWEB.",
      "Drivechains are coming — Litecoin will eat half the crypto market.",
      "He who folds Bitcoin-only first wins.",
      "You can’t spell believe without Lee.",
      "You can’t spell definitely without Lee.",
      "Litecoin is set to shock everyone.",
      "Historically, this is a great time to load up on Litecoin.",
      "Litecoin is at the bottom of an eight-year consolidation triangle.",
      "Bitcoin started the chapter — Litecoin writes the next one.",
      "You don’t want the hottest altcoin — you want the one that’s actually being adopted.",
      "Litecoin mining is now more profitable than Bitcoin mining.",
      "Litecoin is like silver to Bitcoin’s gold — faster and more practical.",
      "Sometimes I forget the majority on this app will eventually own Litecoin.",
      "Litecoin is that quiet giant everyone keeps sleeping on.",
      "The real alpha is switching from BTC-only to BTC + LTC.",
      "Privacy is a feature, not a bug — Litecoin has MWEB.",
      "Litecoin is the Lone Star — everything gets bigger with LTC.",
      "Do not fade this Litecoin fractal.",
      "Litecoin is the most undervalued asset in crypto history.",
      "The Litecoin ETF is already here — most people just haven’t noticed yet.",
      "Litecoin is money you can actually use.",
      "Litecoin is the cleanest shirt in the dirty laundry of crypto.",
      "One drivechain changes everything.",
      "Litecoin is phoenix den to Bitcoin's dragon den",
      "People find Litecoin and still don’t see the opportunity.",
      "This is when you go Litecoin-only.",
      "Litecoin is the original Bitcoin upgrade.",
      "The next 100x is hiding in plain sight — it’s called Litecoin.",
      "Litecoin season is closer than you think.",
      "Litecoin is the quiet king waiting to be crowned.",
      "Litecoin is inevitable.",
      "Litecoin is the future of digital money."
    ];
    function randomFrom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    let phraseObj = null;
    function createLogos() {
      for (let i = 0; i < NUM_LOGOS; i++) {
        const img = document.createElement('img');
        img.src = LOGO_SRC;
        img.className = 'ltc-logo';
        const size = 70 + Math.random() * 160;
        img.style.width = size + 'px';
        document.getElementById('page-clock').appendChild(img);
        logos.push({
          el: img,
          x: Math.random() * (window.innerWidth - size),
          y: Math.random() * (window.innerHeight - size - 80),
          vx: (Math.random() * 1.3 + 0.3) * (Math.random() < 0.5 ? 1 : -1),
          vy: (Math.random() * 1.3 + 0.3) * (Math.random() < 0.5 ? 1 : -1),
          phase: Math.random() * Math.PI * 2,
          opacityBase: 0.015 + Math.random() * 0.03,
          opacityAmp: 0.03 + Math.random() * 0.04
        });
      }
    }
    function createPhrase() {
      const el = document.createElement('div');
      el.className = 'ltc-phrase';
      document.getElementById('page-clock').appendChild(el);
      phraseObj = { el, x:0, y:0, vx:0, vy:0, phase:0 };
      resetPhrase();
    }
    function resetPhrase() {
      if (!phraseObj) return;
      const el = phraseObj.el;
      el.textContent = randomFrom(phrases);
      const fontSize = 16 + Math.random() * 22;
      el.style.fontSize = fontSize + 'px';
      const w = window.innerWidth, h = window.innerHeight - 80;
      const pw = el.offsetWidth || 200, ph = el.offsetHeight || 60;
      phraseObj.x = Math.random() * Math.max(10, w - pw - 20);
      phraseObj.y = Math.random() * Math.max(10, h - ph - 20);
      phraseObj.vx = (Math.random() * 0.8 + 0.25) * (Math.random() < 0.5 ? 1 : -1);
      phraseObj.vy = (Math.random() * 0.8 + 0.25) * (Math.random() < 0.5 ? 1 : -1);
      phraseObj.phase = 0;
    }
    function animate() {
      const w = window.innerWidth, h = window.innerHeight - 80;
      logos.forEach(logo => {
        const el = logo.el;
        const lw = el.offsetWidth, lh = el.offsetHeight;
        logo.x += logo.vx; logo.y += logo.vy;
        if (logo.x <= 0 || logo.x + lw >= w) logo.vx *= -1;
        if (logo.y <= 0 || logo.y + lh >= h) logo.vy *= -1;
        logo.phase += 0.01 + Math.random() * 0.008;
        const fade = 0.5 + 0.5 * Math.sin(logo.phase);
        el.style.opacity = logo.opacityBase + logo.opacityAmp * fade;
        el.style.left = logo.x + 'px';
        el.style.top = logo.y + 'px';
      });
      if (phraseObj) {
        const el = phraseObj.el;
        const pw = el.offsetWidth || 200, ph = el.offsetHeight || 60;
        phraseObj.x += phraseObj.vx; phraseObj.y += phraseObj.vy;
        if (phraseObj.x <= 0 || phraseObj.x + pw >= w) phraseObj.vx *= -1;
        if (phraseObj.y <= 0 || phraseObj.y + ph >= h) phraseObj.vy *= -1;
        phraseObj.phase += 0.01;
        const fade = 0.5 + 0.5 * Math.sin(phraseObj.phase);
        el.style.opacity = 0.12 + 0.35 * fade;
        el.style.left = phraseObj.x + 'px';
        el.style.top = phraseObj.y + 'px';
        if (phraseObj.phase > Math.PI * 2) resetPhrase();
      }
      requestAnimationFrame(animate);
    }
    window.addEventListener('resize', () => {
      logos.forEach(l => l.el.remove());
      logos.length = 0;
      createLogos();
      resetPhrase();
    });
    createLogos();
    createPhrase();
    animate();
   
    document.getElementById('arrow-left').style.opacity = '0.3';
  </script>
</body>
</html>
