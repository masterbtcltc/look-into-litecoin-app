name: Update BitInfoCharts Metrics

on:
  schedule:
    # Runs every day at 08:00 UTC (change if you want a different time)
    - cron: "0 8 * * *"
  workflow_dispatch:   # Allows you to run it manually anytime

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scrape_metrics.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics.json
          git diff --staged --quiet || git commit -m "chore: update metrics from BitInfoCharts $(date -u +%Y-%m-%d)"
          git push
